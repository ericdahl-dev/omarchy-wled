name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o omarchy-wled_linux_amd64 .

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o omarchy-wled_linux_arm64 .

      - name: Package binaries
        run: |
          tar czf omarchy-wled_${{ github.ref_name }}_linux_amd64.tar.gz \
            --transform 's|omarchy-wled_linux_amd64|omarchy-wled|' \
            omarchy-wled_linux_amd64 README.md omarchy-wled@.service
          tar czf omarchy-wled_${{ github.ref_name }}_linux_arm64.tar.gz \
            --transform 's|omarchy-wled_linux_arm64|omarchy-wled|' \
            omarchy-wled_linux_arm64 README.md omarchy-wled@.service

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          generate_release_notes: true
          files: |
            omarchy-wled_${{ github.ref_name }}_linux_amd64.tar.gz
            omarchy-wled_${{ github.ref_name }}_linux_arm64.tar.gz

  aur-release:
    name: Publish to AUR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: omarchy-wled
          pkgbuild: ./PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.VERSION }}"
