[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omarchy-wled"
version = "0.2.1"
description = "Sync Omarchy theme accent or wallpaper color to a WLED device"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
bg = ["Pillow>=10.0"]
all = ["watchdog>=4.0", "Pillow>=10.0", "textual>=0.1", "textual-slider"]
tui = ["textual>=0.1", "textual-slider"]

[project.scripts]
omarchy-wled = "omarchy_wled:main"
omarchy-wled-tui = "omarchy_wled_tui:main"

[tool.hatch.build.targets.wheel]
packages = ["omarchy_wled.py", "omarchy_wled_tui.py"]
